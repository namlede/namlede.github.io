    <h1>Lichen</h1>
    <textarea rows="20" cols="40" style="border:none;">
      Lichens are composite organisms formed by a symbiosis between a fungus (the mycobiont) and one or more photosynthetic partners — either a green alga, a cyanobacterium, or both (the photobiont). The fungus provides the structural scaffold and microenvironment, while the photobiont fixes carbon via photosynthesis and shares the resulting sugars. For a long time the textbook picture was a clean two-player mutualism, but in 2016 Toby Spribille and collaborators found that many lichens also harbor basidiomycete yeasts embedded in the cortex, which may contribute to chemical defense — so the "simple" symbiosis is at minimum a three-way affair. Lichens reproduce in two broad modes: the fungal partner can reproduce sexually via spores (which then must re-acquire a photobiont from the environment), or the whole composite can propagate asexually through fragments like soredia or isidia that carry both partners together. Their growth rates are extremely slow — often millimeters per year — which makes them useful for dating rock surfaces (lichenometry). They're also famously pollution-sensitive because they absorb water and dissolved gases directly across their surface with no roots or cuticle to filter contaminants, so their presence or absence on trees and rocks is a rough proxy for local air quality, particularly SO₂ levels.
</antml:span>

<antml:source>Permafrost</antml:source>
<antml:document_content>
<antml:span index="1-1">
Permafrost is ground that remains at or below 0°C for at least two consecutive years, though in practice much of it has been frozen for millennia. It underlies roughly a quarter of the Northern Hemisphere's land surface, mostly in Siberia, Alaska, and northern Canada, and can extend hundreds of meters deep — the deepest recorded permafrost in Siberia goes over 1,500 meters. The top layer that thaws and refreezes seasonally is called the active layer, and its depth (typically tens of centimeters to a few meters) determines what can grow and what engineering is feasible on the surface. The reason permafrost gets so much attention in climate science is that it's an enormous carbon reservoir: roughly 1,400–1,600 gigatons of organic carbon are locked in permafrost soils, about twice what's currently in the atmosphere. As it thaws, microbial decomposition of that organic matter releases CO₂ under aerobic conditions and CH₄ under anaerobic (waterlogged) conditions, and since methane has a much higher per-molecule warming potential over short timescales, the aerobic vs. anaerobic breakdown ratio matters a lot for the feedback's strength. There's active debate about whether this constitutes a potential tipping point — a threshold beyond which thaw becomes self-sustaining — or whether it's better modeled as a gradual, roughly linear release proportional to cumulative warming. Practically, thawing permafrost also wreaks havoc on infrastructure: buildings, pipelines, and roads built on what was assumed to be permanently frozen ground develop differential settlement as ice-rich soil loses structural integrity, which is already causing billions of dollars in damage across Arctic towns.
